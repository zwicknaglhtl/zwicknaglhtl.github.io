<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔊 Mein Soundboard</title>
  <link rel="manifest" href="manifest.json"> <!-- für Progressive Web App -->

  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: white;
      text-align: center;
      padding: 20px;
    }

    /* Grid-Layout für die Sound-Buttons */
    .sound-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
      max-width: 500px;
      margin: 20px auto;
    }

    /* Button-Styling */
    .sound-btn {
      background-color: #1e1e2e;
      color: white;
      border: 2px solid #313244;
      border-radius: 12px;
      padding: 20px 10px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.1s;
    }

    .sound-btn:active {
      transform: scale(0.95);
      background-color: #45475a;
    }

    .emoji {
      font-size: 2.5rem;
    }
  </style>
</head>
<body>

  <h1>🔊 Mein Soundboard</h1>

  <!-- Container für die dynamischen Buttons -->
  <div class="sound-board" id="soundBoard"></div>

  <script>
    // *** Sound Buttons und Funktion aus Array erstellen ***

    // 1. Liste der Sounds mit MP3-Links
    const sounds = [
      { name: 'James Bond', emoji: '🔫', file: 'media/bond-james-bond.mp3' },
      { name: 'Besten der Besten', emoji: '💯', file: 'media/die-besten-der-besten.mp3' },
      { name: 'Ich bin der Dude!', emoji: '🧔🏻‍♂️', file: 'media/i-am-the-dude.mp3' },
      { name: 'Focus Trinity', emoji: '🎯', file: 'media/focus-trinity.mp3' },
      { name: 'Houston', emoji: '🚀', file: 'media/houston-we-have-a-problem.mp3' },
      { name: 'Eagle has landed', emoji: '🦅', file: 'media/eagle-has-landed.mp3' },
      { name: 'Ich bin dein Vater', emoji: '🖤', file: 'media/ich-bin-dein-vater.mp3' },
      { name: 'Ist das alles?', emoji: '❓', file: 'media/ist-das-alles.mp3' },
      { name: 'Make my day', emoji: '🤏', file: 'media/make-my-day.mp3' },
      { name: 'Maxiums', emoji: '🏺', file: 'media/mein-name-ist-maxiums.mp3' },
      { name: 'Back', emoji: '🛬', file: 'media/i-ll-be-back.mp3' },
      { name: 'Hasta la vista', emoji: '👋', file: 'media/hasta-la-vista-baby.mp3' }
    ];

    const board = document.getElementById('soundBoard');

    // 2. Für jeden Sound im Array einen Button erstellen
    sounds.forEach(sound => {
      const button = document.createElement('button');
      button.className = 'sound-btn';
      button.innerHTML = `<span class="emoji">${sound.emoji}</span><span>${sound.name}</span>`;

      let audio = null;

      // 3. Beim Klick den Sound abspielen bzw. stoppen falls er bereits läuft
      button.addEventListener('click', () => {
        if (audio && !audio.paused) {
          audio.pause();
          audio.currentTime = 0;
        } else {
          if (!audio) {
            audio = new Audio(sound.file);
          }
          audio.currentTime = 0;
          audio.play().catch(() => {});
        }
      });

      board.appendChild(button);
    });


    // *** für PWA: Service Worker Registrierung ***
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker erfolgreich registriert!', reg))
          .catch(err => console.error('Service Worker Fehler:', err));
      });
    }


  </script>

</body>
</html>
